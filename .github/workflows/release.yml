name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mllang
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build parser/

      - name: Verify metadata
        run: twine check parser/dist/*

      - name: Run conformance suite as final gate
        run: |
          pip install -e parser/
          python conformance/run_conformance.py

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN secret not set — skipping upload."
            echo "Add a PyPI API token at:"
            echo "  Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "  Name: PYPI_API_TOKEN"
            exit 0
          fi
          twine upload parser/dist/*
