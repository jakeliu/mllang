name: Release to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref to build from (tag or branch)'
        required: true
        default: 'v0.1.5'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.summary.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build mllang-protocol sdist + wheel
        run: python -m build parser/

      - name: Build shim-engine sdist + wheel
        run: python -m build shim/

      - name: Install both packages locally
        run: |
          pip install -e parser/
          pip install -e 'shim/[mllang]'

      - name: Run mllang conformance suite as final gate
        run: python conformance/run_conformance.py

      - name: Run shim-engine end-to-end test
        run: python conformance/test_shim.py

      - name: Upload mllang-protocol dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mllang-protocol-dist
          path: parser/dist/

      - name: Upload shim-engine dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: shim-engine-dist
          path: shim/dist/

      - id: summary
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  publish-mllang-protocol:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mllang-protocol
    permissions:
      id-token: write     # OIDC trusted-publishing
    steps:
      - name: Download mllang-protocol dist
        uses: actions/download-artifact@v4
        with:
          name: mllang-protocol-dist
          path: dist/
      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-shim-engine:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shim-engine
    permissions:
      id-token: write     # OIDC trusted-publishing
    steps:
      - name: Download shim-engine dist
        uses: actions/download-artifact@v4
        with:
          name: shim-engine-dist
          path: dist/
      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
