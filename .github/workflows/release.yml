name: Release to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref to build from (tag or branch)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mllang
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build mllang-protocol sdist + wheel
        run: python -m build parser/

      - name: Build agent-shim sdist + wheel
        run: python -m build shim/

      - name: Verify mllang-protocol metadata
        run: twine check parser/dist/*

      - name: Verify agent-shim metadata
        run: twine check shim/dist/*

      - name: Install both packages locally
        run: |
          pip install -e parser/
          pip install -e shim/

      - name: Run mllang conformance suite as final gate
        run: python conformance/run_conformance.py

      - name: Run agent-shim end-to-end test
        run: python conformance/test_shim.py

      - name: Upload mllang-protocol to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN secret not set — skipping mllang-protocol upload."
            exit 0
          fi
          twine upload --skip-existing parser/dist/*

      - name: Upload agent-shim to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN secret not set — skipping agent-shim upload."
            exit 0
          fi
          twine upload --skip-existing shim/dist/*
