[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shim-engine"
version = "0.1.0"
description = "Local-first observability for LLM-agent loops. JSONL log, no SaaS, optional MLLANG awareness."
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Jake Liu"}
]
keywords = ["llm", "agents", "observability", "telemetry", "instrumentation", "mllang", "shim"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
mllang = ["mllang-protocol>=0.1.5"]
tiktoken = ["tiktoken>=0.5"]

[project.scripts]
shim-engine-report = "shim_engine.report:main"

[project.urls]
Homepage = "https://github.com/jakeliu/mllang"
Repository = "https://github.com/jakeliu/mllang"
Documentation = "https://github.com/jakeliu/mllang/blob/main/docs/shim.md"
Issues = "https://github.com/jakeliu/mllang/issues"

[tool.setuptools.packages.find]
include = ["shim_engine*"]
